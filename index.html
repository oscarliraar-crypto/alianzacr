<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Alianza Sopaipas_Chile • chile • mirmidones — Gestor Competitivo Oficial</title>
  <style>
    :root {
      --purple: #6a2c91; --purple-dark: #3b1354; --gold: #f5b700; --gold-dark: #b88200;
      --blue: #1b6ca8; --blue-light: #7fbfe9;
      --bg: #f0f2f7; --card: #ffffff; --text: #1c2230; --muted: #646d80; --border: #dde2ec;
      --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --vet: #6d28d9;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }

    /* ================= PORTADA VERTICAL ================= */
    .landing {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 24px 16px 18px;
      color: #fff;
      position: relative;
      background-color: #14192d;
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }
    .landing::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(16,12,34,.68) 0%, rgba(16,12,34,.35) 45%, rgba(12,15,28,.88) 100%);
      z-index: 0;
    }
    .landing > * { position: relative; z-index: 1; width: 100%; max-width: 440px; }

    .landing-top {
      background: linear-gradient(135deg, rgba(73,26,102,.92), rgba(106,44,145,.88));
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 14px 14px 12px;
      box-shadow: 0 10px 28px rgba(0,0,0,.45);
    }
    .landing-badge {
      display: inline-block;
      background: var(--gold);
      color: #1f1600;
      font-weight: 800;
      font-size: .72rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .landing-title {
      margin: 0;
      font-size: 1.28rem;
      font-weight: 800;
      line-height: 1.2;
      text-shadow: 0 2px 4px rgba(0,0,0,.5);
    }
    .landing-clans-sub {
      margin-top: 4px;
      font-size: .85rem;
      font-weight: 700;
      color: #fde68a;
      letter-spacing: .03em;
    }
    .landing-subtitle {
      margin: 8px 0 0;
      font-size: .82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #fff;
      opacity: .95;
    }

    .landing-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: auto 0 16px;
    }
    .clan-entry-btn {
      width: 100%;
      border: 2px solid rgba(255,255,255,.35);
      border-radius: 12px;
      padding: 14px 16px;
      background: linear-gradient(135deg, rgba(27,108,168,.92), rgba(17,67,112,.94));
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      box-shadow: 0 8px 20px rgba(0,0,0,.38);
      transition: transform .12s ease, border-color .12s ease;
    }
    .clan-entry-btn:active { transform: scale(.985); }
    .clan-entry-btn:hover { border-color: var(--gold); }
    .clan-entry-btn.n1 { background: linear-gradient(135deg, rgba(106,44,145,.94), rgba(59,19,84,.96)); border-color: var(--gold); }
    .clan-entry-btn strong { display: block; font-size: 1.05rem; }
    .clan-entry-btn small { display: block; font-size: .78rem; opacity: .88; margin-top: 2px; }
    .clan-entry-arrow { font-size: 1.2rem; font-weight: 800; color: var(--gold); }

    .landing-footer {
      display: flex;
      justify-content: center;
      padding-top: 4px;
    }
    .btn-sys-mini {
      background: rgba(15,23,42,.78);
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-sys-mini:hover { color: #fff; border-color: #fff; }

    /* ================= VISTA INTERNA ================= */
    .app-shell { display: none; }
    .app-shell.active { display: block; }

    .top-strip {
      background: #1e2436;
      color: #fff;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 35;
      box-shadow: 0 2px 8px rgba(0,0,0,.22);
    }
    .top-strip-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .btn-home {
      background: rgba(255,255,255,.14);
      color: #fff;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .clan-title-wrap { min-width: 0; }
    .clan-title-wrap strong { display: block; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .clan-title-wrap span { display: block; font-size: .74rem; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .quick-clans { display: flex; gap: 4px; flex: none; }
    .quick-clans button {
      background: rgba(255,255,255,.1);
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: .74rem;
      font-weight: 700;
      cursor: pointer;
    }
    .quick-clans button.active { background: var(--gold); color: #1f1600; border-color: var(--gold); }

    .container { max-width: 1320px; margin: 10px auto; padding: 0 10px 48px; }

    /* ================= FRANJA DELGADA TAREAS A REALIZAR ================= */
    .tasks-bar {
      background: #fffbeb;
      border: 1px solid #f59e0b;
      border-left: 5px solid #d97706;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(180,83,9,.08);
    }
    .tasks-bar-head {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      background: linear-gradient(90deg, #fef3c7, #fffbeb);
    }
    .tasks-bar-head-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: .83rem;
      font-weight: 700;
      color: #78350f;
    }
    .tasks-count-pill {
      background: #d97706;
      color: #fff;
      font-size: .72rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .tasks-toggle-txt { font-size: .76rem; font-weight: 700; color: #92400e; white-space: nowrap; }
    .tasks-bar-body {
      display: none;
      padding: 12px;
      background: #fff;
      border-top: 1px solid #fde68a;
    }
    .tasks-bar.open .tasks-bar-body { display: block; }

    .task-section-title {
      font-size: .86rem;
      font-weight: 800;
      color: var(--purple-dark);
      margin: 12px 0 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .task-section-title:first-child { margin-top: 0; }
    .task-sheet-wrap {
      border: 1px solid var(--border);
      border-radius: 7px;
      overflow-x: auto;
      margin-bottom: 8px;
    }
    .task-sheet { width: 100%; border-collapse: collapse; font-size: .81rem; }
    .task-sheet th { background: #f1f5f9; font-size: .72rem; padding: 7px 9px; color: #334155; text-align: left; }
    .task-sheet td { padding: 7px 9px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .task-sheet tr:last-child td { border-bottom: none; }

    /* ================= CARRERA DEL RÍO ================= */
    .race { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .tl { display: flex; align-items: flex-end; margin: 6px 0 4px; flex-wrap: nowrap; overflow-x: auto; padding: 30px 6px 20px; }
    .tl-item { position: relative; display: flex; flex-direction: column; align-items: center; }
    .tl-item small { position: absolute; top: 22px; white-space: nowrap; font-size: .76rem; font-weight: 700; }
    .dot { width: 18px; height: 18px; border-radius: 50%; display: block; border: 2px solid; }
    .dot.g { background: #bbf7d0; border-color: #4ade80; }
    .dot.p { background: #ddd6fe; border-color: #a78bfa; }
    .dot.cur { background: #facc15; border-color: #eab308; width: 24px; height: 24px; }
    .line { width: 26px; height: 3px; background: #d1d5db; display: block; margin-bottom: 8px; }
    .bubble { position: absolute; top: -30px; font-size: .95rem; padding: 2px 6px; border-radius: 6px; }
    .bubble.g { background: #bbf7d0; } .bubble.p { background: #ddd6fe; }
    .legend { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 14px; margin: 4px 0 10px; }
    .seg { display: inline-flex; margin-bottom: 12px; border-radius: 6px; overflow: hidden; border: 1px solid var(--blue); }
    .seg button { border: 0; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: .83rem; background: var(--blue-light); color: #0b3a5c; }
    .seg button.active { background: var(--blue); color: #fff; }
    .rivals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-bottom: 8px; }
    .rival-card {
      background: var(--card); border: 1px solid var(--border); border-top: 4px solid var(--purple);
      border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: box-shadow .12s ease, transform .1s ease;
    }
    .rival-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.1); transform: translateY(-1px); }
    .rival-card.ours { border-top-color: var(--blue); background: #f6faff; }
    .rival-card.ally { border-top-color: #0ea5e9; }
    .rival-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; font-size: .9rem; }
    .rival-head .nm { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .rival-head .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: underline dotted; }
    .shield { width: 26px; height: 30px; flex: none; object-fit: contain; }
    .rival-meta { margin-top: 6px; font-size: .79rem; color: var(--muted); line-height: 1.55; }
    .bar { height: 11px; background: #e5e7eb; border-radius: 6px; overflow: hidden; display: flex; margin-top: 7px; }
    .bar i { display: block; height: 100%; }
    .bar .dk { background: #2480cc; } .bar .lt { background: var(--blue-light); }
    .badge-coliseo { display: inline-block; background: #fef3c7; color: #92400e; font-weight: 700; font-size: .78rem; padding: 3px 9px; border-radius: 999px; margin-left: 8px; }

    /* ================= CONTROLES Y TABLAS ================= */
    .toolbar { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .toolbar select, .panel select { padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; font-size: .82rem; background: #fff; }
    .subnav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .subnav button { padding: 7px 11px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-weight: 600; font-size: .82rem; color: var(--text); }
    .subnav button.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .83rem; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; text-align: left; }
    th { background: #eef1f7; font-size: .74rem; text-transform: uppercase; color: #374151; }
    th.sortable { cursor: pointer; user-select: none; }
    tr:hover td { background: #f9fbff; }
    td.num, th.num { text-align: right; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .72rem; font-weight: 700; }
    .pill-ok { background: #dcfce7; color: var(--ok); } .pill-warn { background: #fef3c7; color: var(--warn); }
    .pill-bad { background: #fee2e2; color: var(--bad); } .pill-vet { background: #ede9fe; color: var(--vet); }
    .btn { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: #fff; color: var(--text); cursor: pointer; font-size: .81rem; font-weight: 600; }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: var(--purple); color: #fff; border-color: var(--purple); }
    .btn-primary:hover { background: var(--purple-dark); }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .panel h3, .panel h4 { margin: 0 0 10px; }
    .muted { color: var(--muted); font-size: .79rem; }
    .est { color: var(--warn); }
    .pos { color: var(--ok); font-weight: 700; } .neg { color: var(--bad); font-weight: 700; }
    .notice { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: .82rem; line-height: 1.45; }

    .season-title { font-weight: 700; margin: 14px 0 6px; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
    .info-item { display: flex; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: #fafbfd; }
    .info-item .ic { font-size: 1.5rem; }
    .info-item b { display: block; font-size: .76rem; color: var(--muted); font-weight: 600; }
    .act-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; background: #3b2a6b; color: #fff; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; font-weight: 700; }
    .act-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--border); background: #f3f6fb; }
    .act-row:nth-child(odd) { background: #e9eef7; }
    .act-rank { width: 30px; height: 30px; border-radius: 6px; background: #94a3b8; color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
    .act-av { width: 34px; height: 34px; border-radius: 50%; background: #cbd5e1; flex: none; display: flex; align-items: center; justify-content: center; color: #475569; font-weight: 700; }
    .act-name { flex: 1; min-width: 0; } .act-name b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .act-name span { font-size: .75rem; color: var(--muted); }
    .decks { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
    .decks i { width: 9px; height: 13px; border-radius: 2px; background: #cbd5e1; display: inline-block; }
    .decks i.on { background: #f59e0b; }
    .medals { min-width: 74px; text-align: right; font-weight: 700; }
    .toggles { display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: .83rem; }
    .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .sticky-col { position: sticky; left: 0; background: #fff; z-index: 2; }

    /* ================= MODALES ================= */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.62); display: none; align-items: center; justify-content: center; padding: 12px; z-index: 60; }
    .modal-backdrop.open { display: flex; }
    .modal { background: #fff; border-radius: 10px; max-width: 780px; width: 100%; max-height: 92vh; overflow-y: auto; box-shadow: 0 22px 50px rgba(0,0,0,.3); }
    .modal-head { background: var(--blue); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 3; }
    .modal-body { padding: 14px 16px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px 18px; font-size: .83rem; margin: 8px 0 14px; }
    .stat-grid div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding: 4px 0; gap: 8px; }
    .badges-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 12px; }
    .badge-item { border: 1px solid var(--border); background: #f8fafc; border-radius: 8px; padding: 6px 8px; cursor: pointer; font-size: .78rem; text-align: center; min-width: 74px; max-width: 110px; }
    .badge-item.sel { border-color: var(--blue); background: #eff6ff; }
    .badge-item img { width: 44px; height: 44px; object-fit: contain; display: block; margin: 0 auto 3px; }
    .badge-item .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge-box-info { background: #eff6ff; border-left: 3px solid var(--blue); padding: 8px 12px; border-radius: 4px; font-size: .82rem; margin-bottom: 14px; line-height: 1.5; }
    .pbar { height: 8px; background: #e5e7eb; border-radius: 5px; margin-top: 6px; overflow: hidden; }
    .pbar i { display: block; height: 100%; background: #111827; }
  </style>
</head>
<body>

  <!-- ==================== 1. PORTADA DE INICIO ==================== -->
  <section id="landingScreen" class="landing">
    <div class="landing-top">
      <span class="landing-badge">Clash Royale</span>
      <h1 class="landing-title">ALIANZA SOPAIPAS_CHILE</h1>
      <div class="landing-clans-sub">Sopaipas_Chile • chile • mirmidones</div>
      <div class="landing-subtitle">Gestor Competitivo Oficial de la Alianza</div>
    </div>

    <div class="landing-actions">
      <button class="clan-entry-btn n1" data-open-tab="N1">
        <div>
          <strong>Sopaipas_Chile</strong>
          <small>#G09GCYPJ · Clan Principal · Mín. 2.400 pts</small>
        </div>
        <span class="clan-entry-arrow">❯</span>
      </button>

      <button class="clan-entry-btn" data-open-tab="N2">
        <div>
          <strong>chile</strong>
          <small>#Q9CYCY2V · Cantera Competitiva · Mín. 2.000 pts</small>
        </div>
        <span class="clan-entry-arrow">❯</span>
      </button>

      <button class="clan-entry-btn" data-open-tab="N3">
        <div>
          <strong>mirmidones</strong>
          <small>#QUCVYPGY · Cantera Base · Mín. 1.600 pts</small>
        </div>
        <span class="clan-entry-arrow">❯</span>
      </button>
    </div>

    <div class="landing-footer">
      <button class="btn-sys-mini" data-open-tab="sistema">⚙ Sistema y Horarios</button>
    </div>
  </section>

  <!-- ==================== 2. VISTA INTERNA DE LA APP ==================== -->
  <div id="appShell" class="app-shell">
    <div class="top-strip">
      <div class="top-strip-left">
        <button class="btn-home" id="btnGoHome">◀ Portada</button>
        <div class="clan-title-wrap">
          <strong id="topTitle">Sopaipas_Chile</strong>
          <span id="topSubtitle">#G09GCYPJ</span>
        </div>
      </div>
      <div class="quick-clans" id="quickNav">
        <button data-tab="N1">Sopaipas</button>
        <button data-tab="N2">chile</button>
        <button data-tab="N3">mirmidones</button>
      </div>
    </div>

    <div class="container">
      <!-- VISTA DE CLAN -->
      <div id="sec-clan">
        <!-- Franja delgada y desplegable de Tareas a realizar -->
        <div class="tasks-bar" id="tasksBar">
          <div class="tasks-bar-head" id="tasksBarToggle">
            <div class="tasks-bar-head-left">
              <span>📋 Tareas a realizar</span>
              <span class="tasks-count-pill" id="tasksCountPill">0 pendientes</span>
            </div>
            <span class="tasks-toggle-txt" id="tasksToggleTxt">Ver detalle ▾</span>
          </div>
          <div class="tasks-bar-body" id="tasksBody"></div>
        </div>

        <!-- Carrera del Río -->
        <div class="race" id="raceBox"></div>

        <!-- Barra de filtros y mínimo del clan -->
        <div class="toolbar">
          <div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px;">
            <label style="font-size:.82rem;">Datos:
              <select id="srcSel">
                <option value="auto">Automático</option>
                <option value="current">Semana en curso</option>
                <option value="closed">Semana cerrada</option>
              </select>
            </label>
            <label style="font-size:.82rem;">Evaluación:
              <select id="evalSel">
                <option value="final">Final (16/16)</option>
                <option value="live">En vivo (según día)</option>
              </select>
            </label>
            <label style="font-size:.82rem;">Mínimo:
              <select id="minScoreSelector"></select>
            </label>
            <span id="activeMinPill" class="pill pill-vet"></span>
          </div>
        </div>

        <!-- Subpestañas del clan -->
        <div class="subnav" id="subNav"></div>
        <div id="subBody"></div>
      </div>

      <!-- VISTA SISTEMA Y HORARIOS -->
      <div id="sec-sistema" style="display:none;">
        <div class="panel">
          <h3>Sistema y Horarios</h3>
          <div class="notice" id="calSummaryBox" style="background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a;">
            Sincronizando horario Helsinki ↔ Santiago...
          </div>
          <div id="seasonSummaryBox" class="muted" style="margin-bottom:12px;">Temporada: detectando...</div>

          <div style="margin-bottom:12px;">
            <label style="display:block; font-size:.83rem; font-weight:600; margin-bottom:4px;">
              URL de tu Cloudflare Worker (sin barra final):
            </label>
            <input id="workerUrlInput" type="text" placeholder="https://tu-worker.tu-subdominio.workers.dev"
              style="width:100%; max-width:540px; padding:8px 10px; border:1px solid var(--border); border-radius:6px; margin-bottom:6px;" />

  <div class="modal-backdrop" id="profileModal">

  <!-- ==================== MODAL INFO COMPLETA DE CLAN RIVAL ==================== -->
  <div class="modal-backdrop" id="rivalModal">
    <div class="modal">
      <div class="modal-head" style="background:var(--purple);">
        <div>
          <div id="rTitle" style="font-weight:700; font-size:1.02rem;"></div>
          <div id="rSubtitle" style="font-size:.79rem; opacity:.92;"></div>
